baseURL = "https://jamescr.dev"
languageCode = "en-us"
title = "James' Blog"
theme = "cactus"
copyright = "you"

# summaryLength = 2

# Main menu which appears below site header.
[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Posts"
url = "/posts"
weight = 2

[[menu.main]]
name = "Projects"
url = "/projects"
weight = 3

[[menu.main]]
name = "About Me"
url = "/about"
weight = 4

[markup]
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

[taxonomies]
  category = "categories"

[params]

  colortheme = "dark" # dark, light, white, or classic
  rss = true

  # Home page settings
  description = "A place where I post about topics that interest me while I learn as I go. I like taking notes. Most of the time it's in a notebook, but sometimes I'll repost them here for the world to see. Except with the SEO I plan on utilizing (none), if YOU are reading this, you already know what you're looking for."
  mainSections = ["posts"]
  showAllPostsOnHomePage = false
  postsOnHomePage = 5
  showProjectsList = true
  projectsUrl = "https://github.com/ottter"

  # https://gohugo.io/functions/format/#hugo-date-and-time-templating-reference
  dateFormat = "2006-01-02" # default

  # Post page settings
  show_updated = false # default

  [params.comments]
    enabled = false

  # the value of name should be an valid font awesome icon name (brands type)
  # https://fontawesome.com/icons?d=gallery&s=brands
  [[params.social]]
    name = "github"
    link = "https://github.com/ottter"
  [[params.social]]
    name = "linkedin"
    link = "https://www.linkedin.com/in/crossjamesr/"

