{{ define "main" }}
<section id="projects">
  <span class="h1">Projects</span>
  <ul class="project-list">
    {{ range .Site.Data.projects.list }}
    <li class="project-item">
      <a href="{{ .url }}">{{ .name }}</a>: {{ .desc | markdownify }}
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
